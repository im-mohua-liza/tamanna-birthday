<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tamanna Kicks It</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --pink:#ff2bd6; --cyan:#00f0ff; --gold:#ffd23f; --ink:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:#12002b; color:var(--ink); font-family:'Poppins',sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  .layer { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; text-align:center; padding:16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); z-index:10; }
  .layer > div { width:100%; }
  .layer.show { display:flex; }
  #title { justify-content:space-between; pointer-events:none; padding-top:28px; padding-bottom:28px; }
  #title .btn { pointer-events:auto; }
  .neon22 { font-family:'Monoton',cursive; font-size:clamp(3.2rem,min(22vw,14vh),9rem); line-height:1; color:#fff;
    text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 40px var(--pink),0 0 80px var(--pink); animation:flicker 3s infinite; }
  @keyframes flicker { 0%,19%,21%,60%,62%,100% { opacity:1; } 20%,61% { opacity:.55; } }
  .big { font-family:'Bungee',cursive; font-size:clamp(1.5rem,6.5vw,2.8rem); line-height:1.1;
    background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:clamp(.9rem,3.5vw,1.1rem); max-width:min(520px,100%); margin:8px auto; opacity:.92; line-height:1.5; text-shadow:0 2px 8px #12002b; }
  .btn { font-family:'Bungee',cursive; font-size:1.15rem; letter-spacing:1px; border:0; cursor:pointer; color:#12002b;
    background:linear-gradient(90deg,var(--cyan),var(--pink)); padding:15px 36px; border-radius:14px; margin-top:14px;
    box-shadow:0 0 25px rgba(255,43,214,.6); transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  #kickBtn { position:fixed; right:max(18px, env(safe-area-inset-right)); bottom:max(18px, env(safe-area-inset-bottom)); width:92px; height:92px; border-radius:50%; border:3px solid #fff; z-index:7; display:none;
    font-family:'Bungee',cursive; font-size:1rem; color:#12002b; background:radial-gradient(circle at 35% 30%,#fff6b0,var(--gold) 55%,#e0a800); box-shadow:0 0 25px var(--gold); touch-action:none; cursor:pointer; }
  #kickBtn.show { display:block; }
  #kickBtn:active { transform:scale(.92); }
  @media (max-height:520px) { #title .sub, #title .hint { display:none; } #title { padding-top:10px; padding-bottom:10px; } #kickBtn { width:76px; height:76px; } }
  .pickLabel { margin-top:6px; font-family:'Bungee',cursive; font-size:.75rem; letter-spacing:2px; color:var(--cyan); margin-bottom:6px; text-shadow:0 2px 6px #12002b; }
  .outfits { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .outfits button { pointer-events:auto; font-family:'Poppins',sans-serif; font-weight:700; font-size:.85rem; color:#fff; background:rgba(18,0,43,.75); border:2px solid rgba(255,255,255,.35); border-radius:999px; padding:8px 14px; cursor:pointer; touch-action:manipulation; }
  .outfits button.on { border-color:var(--gold); box-shadow:0 0 14px var(--gold); color:var(--gold); }
  .hint { margin-top:10px; font-size:.85rem; opacity:.8; text-shadow:0 2px 6px #12002b; }

  .hud { position:fixed; top:0; left:0; right:0; display:none; justify-content:space-between; align-items:flex-start; padding:12px 16px; z-index:5; pointer-events:none; }
  .hud.show { display:flex; }
  .stat { font-family:'Bungee',cursive; text-align:left; }
  .stat small { display:block; font-size:.7rem; letter-spacing:2px; color:var(--cyan); }
  .stat b { font-size:2.2rem; line-height:1; color:#fff; text-shadow:0 0 12px var(--pink); }
  .stat span { font-size:1rem; opacity:.6; }
  .right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .lives { font-size:1.3rem; letter-spacing:2px; }
  #kicked { font-family:'Bungee',cursive; font-size:.8rem; color:var(--gold); }
  #mute { pointer-events:auto; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:10px; padding:5px 10px; font-size:1rem; cursor:pointer; }

  #pop { position:fixed; left:0; right:0; top:20%; text-align:center; z-index:6; pointer-events:none; opacity:0; padding:0 16px; }
  #pop.go { animation:popup 1.9s ease-out forwards; }
  #pop div { font-family:'Bungee',cursive; font-size:clamp(1.2rem,5.5vw,2.2rem); color:var(--gold); text-shadow:0 0 14px var(--pink),0 4px 0 #6a0058; }
  @keyframes popup { 0% { opacity:0; transform:scale(.4); } 15% { opacity:1; transform:scale(1.15); } 25% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-30px); } }

  #over { justify-content:center; background:rgba(18,0,43,.6); }
  #finale { justify-content:flex-start; overflow-y:auto; padding-top:30px; background:rgba(18,0,43,.6); }
  .photos { display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin:22px 0 10px; }
  .frame { width:min(40vw,210px); padding:8px; border-radius:16px; background:#12002b; border:3px solid var(--cyan);
    box-shadow:0 0 20px var(--cyan),inset 0 0 12px var(--cyan); animation:sway 2.2s ease-in-out infinite alternate; }
  .frame:nth-child(2) { border-color:var(--pink); box-shadow:0 0 20px var(--pink),inset 0 0 12px var(--pink); animation-delay:-1.1s; }
  @keyframes sway { from { transform:rotate(-4deg); } to { transform:rotate(4deg) translateY(-6px); } }
  .frame img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; display:block; }
  .frame span { display:block; font-family:'Bungee',cursive; font-size:.85rem; margin-top:8px; color:var(--gold); }
  .reasons { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; max-width:620px; width:100%; margin:18px 0; }
  .reason { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:14px; font-weight:600; opacity:0; animation:rise .5s ease-out forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
  .letter { background:rgba(255,255,255,.95); color:#2a0845; border-radius:18px; padding:22px; max-width:540px; text-align:left; white-space:pre-line; line-height:1.6; box-shadow:0 0 30px rgba(255,43,214,.5); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud">
  <div class="stat"><small>WINS UNLOCKED</small><b id="winNum">0</b> <span id="winGoal"></span></div>
  <div class="right"><div style="display:flex;gap:8px;align-items:center"><div class="lives" id="lives"></div><button id="mute" title="Music on/off">🔊</button></div><div id="kicked"></div></div>
</div>
<div id="pop"><div id="popText"></div></div>
<button id="kickBtn">🦵<br>KICK</button>

<!-- TITLE: Tamanna is drawn on the canvas between the text and the button -->
<section class="layer show" id="title">
  <div>
    <div class="neon22" id="titleAge">22</div>
    <div class="big" id="titleName"></div>
    <p class="sub" id="titleSub"></p>
    <div class="pickLabel">Pick her outfit</div>
    <div class="outfits" id="outfits"></div>
  </div>
  <div>
    <button class="btn" id="startBtn">LET'S KICK IT ▶</button>
    <p class="hint">Tap anywhere (or the KICK button, or space) to kick out the bad stuff. Let the wins come to her.</p>
  </div>
</section>

<section class="layer" id="over">
  <div class="big">Even queens take a breather</div>
  <p class="sub" id="overText"></p>
  <button class="btn" id="againBtn">BACK IN THE GAME 🔥</button>
</section>

<section class="layer" id="finale">
  <div class="neon22" id="finAge">22</div>
  <div class="big" id="finName"></div>
  <p class="sub">QUEEN LEVEL UNLOCKED 👑</p>
  <div class="photos" id="photos"></div>
  <div class="big" style="font-size:1.4rem;margin-top:10px">Why she's the queen</div>
  <div class="reasons" id="reasons"></div>
  <div class="letter" id="letter"></div>
  <button class="btn" onclick="location.reload()">PLAY AGAIN ↻</button>
  <div style="height:50px"></div>
</section>

<script>
/* ==============================================================
   CONFIG  -  everything about Tamanna lives here
   ============================================================== */
const CONFIG = {
  name: "Tamanna",
  age: 22,
  from: "Mohua",
  subtitle: "Kick every bit of negativity out of her life and unlock win after win after win.",

  // Bad stuff she kicks out
  negativity: ["NEGATIVITY","HATERS","DRAMA","SELF-DOUBT","STRESS","JEALOUSY","FAKE FRIENDS","MONDAYS","OVERTHINKING","EXCUSES","BAD VIBES","FEAR"],
  // Giant bad things that need 3 kicks (they show up at these win counts)
  bosses: { 7: "OVERTHINKING", 15: "SELF-DOUBT" },
  // What she shouts when she kicks
  kickWords: ["KICKED OUT!","BYE!","NOT TODAY!","NEXT!","BLOCKED!","OUT OF MY LIFE!","GET OUT!"],
  // Wins she unlocks, one by one. Reach the last one to finish the game.
  wins: [
    ["🎓","Top of the class"], ["💼","Dream job"], ["💸","Salary day"], ["🏔️","Mountains conquered"],
    ["✈️","New city unlocked"], ["📸","Iconic photoshoot"], ["🏆","Star performer"], ["💪","Glow-up era"],
    ["💎","Self-worth: priceless"], ["🌍","World is her stage"], ["🎤","Main character"], ["🚀","Promotion"],
    ["🧠","Big brain moves"], ["💖","Real ones only"], ["🌟","Shining brighter"], ["💃","Dancing through life"],
    ["📈","Growth mode"], ["🛍️","Treat yourself"], ["🌅","New beginnings"], ["🔥","Unstoppable"],
    ["🎂","22 and thriving"], ["👑","QUEEN MODE"],
  ],

  photos: [ { src: "photo1.jpg", caption: "Energy: unmatched" }, { src: "photo2.jpg", caption: "Mountain queen" } ],
  reasons: [
    "Successful at 22 💼", "Full of life, every single day", "Turns any place into a photoshoot 📸",
    "Mountains? Conquered. 🏔️", "Kicks out negativity like a pro 🦵", "The energy every room needs ⚡",
  ],
  letter:
`Dear Tamanna,

Happy 22nd birthday! 🎉

You are full of life, full of energy, and already so successful. Nothing slows you down: not haters, not drama, not doubt. You just kick it out and keep winning.

Keep going higher and higher. This year is yours, queen.

With love,
Mohua`,

  // Her face crop (fractions of the photo). Measured on photo2.jpg.
  // Front-facing face from the bar photo; faceTilt (degrees) straightens her head tilt.
  facePhoto: "photo1.jpg", faceX: 0.4733, faceY: 0.5, faceRX: 0.0822, faceRY: 0.0625, faceTilt: 17,
  gown: ["#ff2b6a", "#c8102e", "#7a0628"],   // gown colours: light, main, dark
};

/* ==============================================================
   GAME CODE
   ============================================================== */
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const face = new Image(); face.src = CONFIG.facePhoto;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, k) => a + (b - a) * k;
const GOAL = CONFIG.wins.length;

let W, H, GY, GH, U;
function size() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  GY = H * 0.8; GH = Math.min(H * 0.42, W * 0.75); U = GH / 110;
}
size(); addEventListener('resize', size);

$('titleAge').textContent = $('finAge').textContent = CONFIG.age;
$('titleName').textContent = `Happy Birthday ${CONFIG.name}`;
$('titleSub').textContent = CONFIG.subtitle;
$('winGoal').textContent = `/ ${GOAL}`;

/* ---------------- AUDIO (all synthesized, no files) ---------------- */
let AC, master, noiseBuf, muted = false, nextT = 0, step = 0, beatOn = false;
const BPM = 112, S16 = 60 / BPM / 4;
const NOTE = { E2:82.41, G2:98, A2:110, B2:123.47, C3:130.81, D3:146.83, E3:164.81 };
const BASS = ['E2',0,'E3',0, 0,'E2',0,'G2', 0,'A2',0,0, 'B2',0,'D3','E3', 'A2',0,'A2','C3', 0,'A2',0,'E2', 0,'G2',0,'G2', 'B2',0,'D3',0];
// Phones: iPhones mute web-game sound when the silent switch is on, and browsers only allow
// sound after a tap. unlockAudio() runs on a tap and switches the page to "media playback" mode.
let silentEl = null;
function silentWavUrl() {
  const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf), s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!silentEl) {
    silentEl = document.createElement('audio'); silentEl.src = silentWavUrl(); silentEl.loop = true;
    silentEl.setAttribute('playsinline', ''); silentEl.setAttribute('webkit-playsinline', '');
  }
  const p = silentEl.play(); if (p && p.catch) p.catch(() => {});
  initAudio();
  if (AC.state !== 'running') AC.resume();
  // play one silent sample inside the tap so the audio engine is definitely unlocked
  const b = AC.createBufferSource(); b.buffer = AC.createBuffer(1, 1, 22050); b.connect(AC.destination); b.start(0);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && beatOn) { AC.resume(); if (silentEl) silentEl.play().catch(() => {}); } });
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  setInterval(scheduler, 25);
}
function env(g, t, peak, len) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + len); }
function kickDrum(t, p = 1) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); env(g, t, p, 0.22); o.connect(g).connect(master); o.start(t); o.stop(t + 0.25); }
function noise(t, hp, peak, len) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp; env(g, t, peak, len); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + len + 0.02); }
function bass(t, fr) { const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(); o.type = 'sawtooth'; o.frequency.value = fr; f.type = 'lowpass'; f.Q.value = 9; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(180, t + 0.18); env(g, t, 0.35, 0.2); o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.22); }
function tone(t, fr, len, type = 'square', peak = 0.12) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = fr; env(g, t, peak, len); o.connect(g).connect(master); o.start(t); o.stop(t + len + 0.02); }
function scheduler() {
  if (!beatOn) { nextT = AC.currentTime + 0.05; return; }
  while (nextT < AC.currentTime + 0.12) {
    const s = step % 16;
    if (s === 0 || s === 7 || s === 10) kickDrum(nextT);
    if (s === 4 || s === 12) noise(nextT, 1500, 0.5, 0.16);
    if (s === 15) noise(nextT, 2000, 0.12, 0.06);
    if (s % 2 === 0) noise(nextT, 7000, s === 14 ? 0.18 : 0.08, s === 14 ? 0.14 : 0.04);
    const n = BASS[step % 32]; if (n) bass(nextT, NOTE[n]);
    nextT += S16; step++;
  }
}
const sfx = {
  swoosh() { if (AC) noise(AC.currentTime, 3000, 0.25, 0.12); },
  smack()  { if (AC) { kickDrum(AC.currentTime, 1.2); tone(AC.currentTime, 220, 0.08, 'square', 0.15); tone(AC.currentTime + 0.06, 880, 0.12, 'triangle', 0.12); } },
  win()    { if (AC) [784, 988, 1319].forEach((f, i) => tone(AC.currentTime + i * 0.06, f, 0.12, 'square', 0.09)); },
  hurt()   { if (AC) { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = 'sawtooth'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.3); env(g, t, 0.3, 0.32); o.connect(g).connect(master); o.start(t); o.stop(t + 0.35); } },
  fanfare(){ if (AC) [523, 659, 784, 1047, 1319].forEach((f, i) => tone(AC.currentTime + i * 0.09, f, 0.2, 'triangle', 0.15)); },
};
function birthdaySong() {
  const f = { G4:392, A4:440, B4:494, C5:523, D5:587, E5:659, F5:698, G5:784 };
  const s = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
             ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
  let t = AC.currentTime + 0.2; const beat = 60 / BPM;
  for (const [n, d] of s) { tone(t, f[n], d * beat * 0.9, 'square', 0.09); tone(t, f[n] * 2, d * beat * 0.5, 'triangle', 0.05); t += d * beat; }
}
$('mute').onclick = e => { e.stopPropagation(); muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55; $('mute').textContent = muted ? '🔇' : '🔊'; };

/* ---------------- GAME STATE ---------------- */
let state = 'title', T = 0, scroll = 0, wins = 0, lives = 3, kicks = 0, combo = 0, shake = 0;
let girlX = 0, kickT = 9, hurtT = 0, bads = [], goods = [], parts = [], floats = [], badT = 1.5, goodT = 1, bossDone = {};
const sparkles = Array.from({ length: 28 }, () => ({ fx: rand(-0.9, 0.9), y: rand(-54, -29), p: rand(0, 6) }));
const mountains = [0, 1].map(() => Array.from({ length: 14 }, () => rand(0.3, 1)));
const KICK_LEN = 0.34;

function kickAmount() {            // 0..1 how extended the kick leg is
  const p = kickT / KICK_LEN; if (p >= 1) return 0;
  return p < 0.3 ? p / 0.3 : p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;
}
function doKick() {
  if (state !== 'play' || kickT < KICK_LEN * 0.85) return;
  kickT = 0; sfx.swoosh(); bads.forEach(b => b.hitThisKick = false);
}
addEventListener('pointerdown', e => { if (AC && AC.state !== 'running') unlockAudio(); if (e.target === cv) doKick(); });
$('kickBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (AC && AC.state !== 'running') unlockAudio(); doKick(); });
addEventListener('keydown', e => { if (['Space', 'ArrowRight', 'KeyK', 'Enter'].includes(e.code)) { e.preventDefault(); doKick(); } });

$('startBtn').onclick = e => {
  e.target.blur(); unlockAudio(); beatOn = true;
  $('title').classList.remove('show'); $('hud').classList.add('show'); $('kickBtn').classList.add('show');
  wins = 0; lives = 3; kicks = 0; combo = 0; bads = []; goods = []; bossDone = {}; badT = 1.2; goodT = 0.8;
  state = 'play'; updateHud(); popup("KICK OUT THE NEGATIVITY! 🦵");
};
$('againBtn').onclick = e => { e.target.blur(); $('over').classList.remove('show'); $('kickBtn').classList.add('show'); lives = 3; bads = []; updateHud(); state = 'play'; beatOn = true; };

function updateHud() {
  $('winNum').textContent = wins;
  $('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
  $('kicked').textContent = `${kicks} kicked out${combo > 2 ? ` · ${combo}x combo` : ''}`;
}
function popup(text) { const p = $('pop'); $('popText').textContent = text; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
function burst(x, y, n, colors = ['#ff2bd6', '#00f0ff', '#ffd23f', '#fff']) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-280, 280), vy: rand(-450, -60), c: pick(colors), life: rand(0.5, 1.1), r: rand(0, 6), s: rand(3, 7) });
}
function floatText(x, y, text, color = '#ffd23f') { floats.push({ x, y, text, color, life: 1 }); }

/* ---------------- UPDATE ---------------- */
function update(dt) {
  T += dt; kickT += dt; hurtT = Math.max(0, hurtT - dt); shake = Math.max(0, shake - dt);
  const playing = state === 'play';
  const targetX = playing || state === 'over' ? W * 0.26 : W * 0.5;
  girlX = girlX ? lerp(girlX, targetX, Math.min(1, dt * 4)) : targetX;
  scroll += H * (playing ? 0.3 : 0.1) * dt;

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt; p.r += dt * 8; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 60 * dt; f.life -= dt * 0.8; }
  floats = floats.filter(f => f.life > 0);

  ctx.shadowBlur = 0; ctx.fillStyle = '#c98a00'; ctx.fillRect(-7, -1.4, 14, 1.6);
  [[-8, -8, '#00f0ff'], [0, -10, '#ff2b6a'], [8, -8, '#00f0ff']].forEach(([a, b, c]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(a, b, 1.3, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#ff2b6a'; ctx.beginPath(); ctx.arc(0, -2.8, 1.4, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * Math.sin(T * 5)) + ')'; ctx.beginPath(); ctx.arc(-3, -3.5, 0.6, 0, 7); ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha = 1;
  // kick impact flash at the foot
  if (k > 0.8) { ctx.save(); ctx.globalAlpha = (k - 0.8) * 4; ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 15;
    const fx = x + 38 * U, fy = GY - 40 * U; for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(fx + Math.cos(a) * 6 * U, fy + Math.sin(a) * 6 * U); ctx.lineTo(fx + Math.cos(a) * 11 * U, fy + Math.sin(a) * 11 * U); ctx.stroke(); } ctx.restore(); }
}

/* ---------------- DRAW: baddies, wins, effects ---------------- */
function drawBad(b) {
  ctx.save(); ctx.translate(b.x, b.y + Math.sin(b.wob) * 4); ctx.rotate(b.out ? b.rot : Math.sin(b.wob) * 0.1);
  const r = b.r;
  ctx.shadowColor = '#ff1744'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#1a0b22';
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2 + b.wob * 0.3; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.35, r * 0.62, 0, 7); ctx.fill(); }
  ctx.shadowBlur = 0;
  // angry eyes + brows
  ctx.fillStyle = '#fff';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(s * r * 0.3, -r * 0.18, r * 0.17, r * 0.13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff1744'; ctx.beginPath(); ctx.arc(s * r * 0.3 - r * 0.05, -r * 0.16, r * 0.07, 0, 7); ctx.fill(); ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#ff1744'; ctx.lineWidth = Math.max(2, r * 0.07); ctx.beginPath(); ctx.moveTo(s * r * 0.48, -r * 0.42); ctx.lineTo(s * r * 0.12, -r * 0.3); ctx.stroke();
  }
  // grumpy mouth
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.5, r * 0.05); ctx.beginPath(); ctx.arc(0, r * 0.3, r * 0.18, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  // label
  const fs = Math.max(10, Math.min(r * 0.32, 22));
  ctx.font = `800 ${fs}px Poppins`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff1744'; const tw = ctx.measureText(b.label).width + 10;
  ctx.fillRect(-tw / 2, r * 0.62, tw, fs + 6); ctx.fillStyle = '#fff'; ctx.fillText(b.label, 0, r * 0.62 + fs / 2 + 3);
  if (b.boss && !b.out) { ctx.fillStyle = '#ffd23f'; ctx.font = `800 ${fs}px Poppins`; ctx.fillText('❤'.repeat(b.hp), 0, -r * 0.9); }
  ctx.restore();
}
function drawGood(g) {
  const s = 1 + Math.sin(g.t) * 0.1, y = g.y + Math.sin(g.t * 0.6) * 6, r = 9 * U;
  ctx.save(); ctx.translate(g.x, y); ctx.scale(s, s);
  ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 25; ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(255,210,63,.18)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.font = `${Math.round(r * 1.1)}px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(g.e, 0, 2);
  ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-8, 8) * shake * 3, rand(-6, 6) * shake * 3);
  drawBackground();
  for (const g of goods) drawGood(g);
  drawGirl(girlX);
  for (const b of bads) drawBad(b);
  for (const p of parts) { ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 2); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
  for (const f of floats) {
    ctx.save(); ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.font = `${Math.round(Math.max(18, U * 7))}px Bungee`; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = '#6a0058'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); ctx.restore();
  }
  ctx.restore();
}

// outfit picker on the title screen
if (!OUTFITS[outfit]) outfit = 'princess';
function renderPicker() {
  $('outfits').innerHTML = '';
  for (const [id, o] of Object.entries(OUTFITS)) {
    const b = document.createElement('button'); b.textContent = o.label; b.className = id === outfit ? 'on' : '';
    b.onclick = () => { outfit = id; try { localStorage.setItem('tamannaOutfit', id); } catch (e) {} renderPicker(); };
    $('outfits').appendChild(b);
  }
}

renderPicker();

let last = 0;
(function loop(ts = 0) { const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts; update(dt); draw(); requestAnimationFrame(loop); })();
</script>
